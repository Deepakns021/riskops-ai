[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskops-ai"
version = "0.1.0"
description = "Human-in-the-loop insider-risk analytics on the synthetic CERT benchmark"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
