[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2FF"
textColor = "#172033"
linkColor = "#1D4ED8"
borderColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "medium"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
baseFontSize = 16
headingFontSizes = ["32px", "24px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
dataframeHeaderBackgroundColor = "#E0E7FF"
dataframeHeaderTextColor = "#172033"
chartCategoricalColors = ["#1D4ED8", "#0F766E", "#B45309", "#7C3AED", "#BE123C"]
